[project]
name = "cortex-operator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3",
    "cryptography>=43",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8", "ruff>=0.6", "psycopg[binary]>=3.2,<4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "S", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLR2004", "S101", "S105", "S608", "PLC0415", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR"]
"cortex_operator/contracts/legacy.py" = ["UP042"]  # original engine type, kept as-is

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cortex_operator*"]
