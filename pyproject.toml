[project]
name = "cortex-operator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8,<3",
    "cryptography>=43",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8", "ruff>=0.6", "psycopg[binary]>=3.2,<4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
# The original engine, linted only once its owning package ports it.
extend-exclude = [
    "cortex_operator/analytics.py", "cortex_operator/crew.py", "cortex_operator/foresight.py",
    "cortex_operator/notion.py", "cortex_operator/postiz.py", "cortex_operator/publishing.py",
    "cortex_operator/run.py", "cortex_operator/taste.py", "cortex_operator/workflow.py",
    "cortex_operator/writer.py", "cortex_operator/*/legacy.py", "cortex_operator/store.py",
    "cortex_operator/truth.py", "cortex_operator/gate.py",
    "tests/test_crew.py", "tests/test_engine.py", "tests/test_notion_writer.py", "tests/test_postiz.py",
    "tests/test_store.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "S", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLR2004", "S101", "S105", "S608", "PLC0415", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR"]
"cortex_operator/contracts/legacy.py" = ["UP042"]  # original engine type, kept as-is

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cortex_operator*"]
