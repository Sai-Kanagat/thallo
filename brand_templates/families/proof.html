<section {{slide_attrs}}>
  <div class="photo" data-role="photo" style="{{photo_style}}"></div>
  <div class="scrim" data-role="scrim"></div>
  <div class="frame" data-region="frame">
    <p class="slot t-display" data-slot="figure">{{figure}}</p>
    <h1 class="slot t-h2" data-slot="headline">{{headline}}</h1>
    <p class="slot t-body" data-slot="detail">{{detail}}</p>
    <p class="slot t-small soft" data-slot="source">{{source}}</p>
  </div>
  <img class="logo" data-role="logo" src="{{logo_src}}" alt="">
</section>
