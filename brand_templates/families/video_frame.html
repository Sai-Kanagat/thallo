<section {{slide_attrs}}>
  <div class="photo" data-role="photo" style="{{photo_style}}"></div>
  <div class="scrim" data-role="scrim"></div>
  <div class="frame" data-region="frame">
    <p class="slot t-small pill" data-slot="kicker">{{kicker}}</p>
    <h1 class="slot t-h1" data-slot="caption">{{caption}}</h1>
  </div>
  <img class="logo" data-role="logo" src="{{logo_src}}" alt="">
</section>
